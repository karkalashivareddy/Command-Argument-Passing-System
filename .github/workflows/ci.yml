name: build-and-test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: make + make test (${{ matrix.cc }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify toolchain
        run: |
          ${{ matrix.cc }} --version | head -n 1
          make --version | head -n 1
          echo "sh: $(command -v sh) -> $(readlink -f "$(command -v sh)")"
          echo "jq: $(jq --version 2>/dev/null || echo 'not installed (JSON test falls back)')"

      - name: Strict warnings build (-Werror)
        run: |
          make clean
          make CC="${{ matrix.cc }}" \
            CFLAGS="-std=c11 -Wall -Wextra -Wpedantic -Werror -g"

      - name: Clean build
        run: make clean && make CC="${{ matrix.cc }}"

      - name: Test suite
        run: make test CC="${{ matrix.cc }}"

      - name: Sanitizer suite (ASan + UBSan, leak detection)
        run: make test-asan CC="${{ matrix.cc }}"

      - name: Working-tree hygiene (no artifacts committed)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
