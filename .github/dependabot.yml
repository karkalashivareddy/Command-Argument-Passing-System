# Dependency updates.
#
# Grouped so a routine bump is one reviewable change instead of a dozen, and
# kept in lockstep with the CI matrix so an update is verified by the same
# jobs that would have caught a regression.
#
# Semver-major npm bumps cannot be suppressed from this file. Both obvious
# ways were tried and Dependabot's own config check rejected each one:
#
#   version-updates.ignore -> "contains additional properties
#                             [\"version-updates\"] outside of the schema"
#   ignore + update-type   -> "contains additional properties
#                             [\"update-type\"] outside of the schema"
#
# So majors are handled by review instead of by config. In practice that
# means: a major bump arrives as a pull request whose checks fail, because a
# breaking change cannot be a lockfile edit. Close it, then raise the major
# deliberately by hand. The `dependency audit` job is the real control, and
# it fails the build on any known high or critical advisory, so an
# unreviewed major cannot quietly land an unpatched dependency.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      fastify:
        patterns: ["fastify", "@fastify/*"]
      zod:
        patterns: ["zod"]
      typescript:
        patterns: ["typescript", "tsx", "vitest", "@types/node"]
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react:
        patterns: ["react", "react-dom", "react-router-dom", "@types/react", "@types/react-dom"]
      three:
        patterns: ["three", "@react-three/fiber", "@react-three/drei", "@types/three"]
      build:
        patterns: ["vite", "vitest", "typescript", "@vitejs/plugin-react", "@tailwindcss/vite", "tailwindcss"]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["actions/*", "github/codeql-action*"]
    commit-message:
      prefix: "deps(ci)"