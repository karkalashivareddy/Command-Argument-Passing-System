# Dependency updates.
#
# Grouped so a routine bump is one reviewable change instead of a dozen, and
# kept in lockstep with the CI matrix so an update is verified by the same
# jobs that would have caught a regression.
version: 2
updates:
  - package-ecosystem: npm
    directory: /web/backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A semver-major npm bump is a migration, not a patch, and Dependabot
    # cannot make that change here: zod 3 -> 4 alone changed how schemas are
    # built. Every major bump attempted so far failed the same jobs that
    # verify main, so majors are raised deliberately by hand instead.
    #
    # `ignore` is used rather than `version-updates.ignore` because the latter
    # is rejected by Dependabot's own config schema for this file.
    ignore:
      - dependency-name: "*"
        update-type: "version-update:semver-major"
    groups:
      fastify:
        patterns: ["fastify", "@fastify/*"]
      zod:
        patterns: ["zod"]
      typescript:
        patterns: ["typescript", "tsx", "vitest", "@types/node"]
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: npm
    directory: /web/frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Same reasoning as the gateway: lucide-react 0 -> 1, jsdom 29 -> 30 and
    # motion 12 -> 13 were all proposed and all broke the frontend build.
    ignore:
      - dependency-name: "*"
        update-type: "version-update:semver-major"
    groups:
      react:
        patterns: ["react", "react-dom", "react-router-dom", "@types/react", "@types/react-dom"]
      three:
        patterns: ["three", "@react-three/fiber", "@react-three/drei", "@types/three"]
      build:
        patterns: ["vite", "vitest", "typescript", "@vitejs/plugin-react", "@tailwindcss/vite", "tailwindcss"]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["actions/*", "github/codeql-action*"]
    commit-message:
      prefix: "deps(ci)"
